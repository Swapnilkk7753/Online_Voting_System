<!-- ================= ADMIN CANDIDATE MANAGEMENT PAGE ================= -->

<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin | Manage Candidates</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      min-height: 100vh;
      color: #fff;
    }

    .navbar {
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
    }

    .glass-card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      margin-bottom: 25px;
    }

    .candidate-img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid #ffc107;
    }

    .table {
      color: #fff;
    }

    .table thead {
      background: rgba(255,255,255,0.2);
    }

    .form-control, .form-select {
      border-radius: 10px;
    }
  </style>

</head>
<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark px-4">
  <a class="navbar-brand fw-bold" href="#">
    <i class="bi bi-people-fill"></i> Candidate Management
  </a>
  <div class="ms-auto">
    <a href="/dashboard" class="btn btn-outline-warning btn-sm">
      <i class="bi bi-arrow-left"></i> Dashboard
    </a>
  </div>
</nav>

<!-- CONTENT -->

<div class="container mt-4">

  <!-- ADD / UPDATE CANDIDATE FORM -->

  <div class="glass-card">
    <h5><i class="bi bi-person-plus-fill"></i> Add / Update Candidate</h5>
    <hr class="text-light">

```
<form method="post" enctype="multipart/form-data">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Candidate Name</label>
      <input type="text" class="form-control" name="CName" placeholder="Enter name" required>
    </div>
    <div class="col-md-6">
       <label class="form-label">Candidate Type</label>
    <select id="userType" class="form-control" name="cantype">
        <option value="">Select Type</option>
        <option value="student">Student</option>
        <option value="employee">Employee</option>
      </select>
      </div>

    <div class="col-md-6">
      <label class="form-label">Role / Position</label>
      <input type="text" class="form-control" name="Role" placeholder="President / Secretary" required>
    </div>

    <div class="col-md-6">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" name="Email" placeholder="candidate@email.com" required>
    </div>

    <div class="col-md-6">
      <label class="form-label">Upload Photo</label>
      <input type="file" class="form-control" name="photo"  accept="image/*" required>
    </div>

    <div class="col-12 text-end">
      <button type="submit" formaction="/Image_upload" class="btn btn-warning">
        <i class="bi bi-save"></i> Save Candidate
      </button>
    </div>
  </div>
</form>
```

  </div>

  <!-- CANDIDATE LIST -->

  <div class="glass-card">
    <h5><i class="bi bi-list-ul"></i> Candidate List</h5>
    <hr class="text-light">

```
<div class="table-responsive">
  <form method="post">
  <table class="table table-borderless align-middle">
    <thead>
      <tr>
        <th>Photo</th>
        <th>Name</th>
        <th>Role</th>
        <th>Email</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {%for i in rw%}
      <tr>
        <td><img src="{{ url_for('static', filename='uploads/' + i[6]) }}" width="150" class="candidate-img"></td>
        <td>{{i[1]}}</td>
        <td>{{i[5]}}</td>
        <td>{{i[2]}}</td>
        <td>
          {%if i[4]==1 %}
          <button type="submit" name="id" value={{i[0]}} formaction="/Canedit" class="btn btn-sm btn-info">Disabled</button>
          {%elif i[4]==0 %}
          <button type="submit" name="id" value={{i[0]}} formaction="/Canedit" class="btn btn-sm btn-info">Enable</button>
          {%endif%}
          <button type="submit" name="id" value={{i[0]}} formaction="/CanDelete" class="btn btn-sm btn-danger"><i class="bi bi-trash"></i></button>
        </td>
      </tr>
      {%endfor%}
      
    </tbody>
  </table>
</form>
</div>
```

  </div>

</div>

</body>
</html>
