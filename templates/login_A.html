<!-- ================= LOGIN PAGE (BOOTSTRAP + SYMBOLS) ================= -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Google Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <style>
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 35px;
      width: 100%;
      max-width: 420px;
      color: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .login-card h3 {
      text-align: center;
      margin-bottom: 25px;
      font-weight: 600;
    }

    .form-control {
      background: rgba(255,255,255,0.85);
      border: none;
      padding-left: 45px;
      border-radius: 10px;
    }

    .input-icon {
      position: absolute;
      top: 50%;
      left: 14px;
      transform: translateY(-50%);
      color: #555;
      font-size: 1.2rem;
    }

    .btn-login {
      background: #ffc107;
      border: none;
      font-weight: 600;
      border-radius: 10px;
      padding: 10px;
    }

    .btn-login:hover {
      background: #ffb300;
    }

    .footer-text {
      text-align: center;
      margin-top: 15px;
      font-size: 0.9rem;
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h3>
      <!--<span class="material-symbols-outlined align-middle">admin_panel_settings</span>-->
      Admin Login
    </h3>

    <form method="POST" action="/login_Admin">

      <!-- Username -->
      <div class="mb-3 position-relative">
        <!--<span class="input-icon material-symbols-outlined">person</span>-->
        <input type="number" class="form-control" name="username" placeholder="UserId" required>
      </div>

      <!-- Password -->
      <div class="mb-3 position-relative">
        <!--<span class="input-icon material-symbols-outlined">lock</span>-->
        <input type="password" class="form-control" name="password" placeholder="Password" required>
      </div>

      <!-- Login Button -->
      <div class="d-grid">
        <button type="submit" class="btn btn-login">
          <i class="bi bi-box-arrow-in-right"></i> Login
        </button>
      </div>

    </form>

    <div class="footer-text">
      <i class="bi bi-shield-lock"></i> Secure Admin Access Only
    </div>
  </div>

</body>
</html>
