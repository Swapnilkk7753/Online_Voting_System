<!-- Event Management Page -->

<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Management | Online Voting System</title>

  <!-- Bootstrap 5 -->

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Google Font -->

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      min-height: 100vh;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    .page-title {
      font-weight: 600;
      color: #ffd200;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-control, .form-select {
      border-radius: 10px;
    }

    .btn-custom {
      background: linear-gradient(135deg, #f7971e, #ffd200);
      border: none;
      color: #000;
      font-weight: 600;
      border-radius: 12px;
      padding: 10px 18px;
    }

    .btn-custom:hover {
      box-shadow: 0 0 15px rgba(255, 210, 0, 0.7);
      transform: translateY(-2px);
    }

    table th {
      color: #ffd200;
    }

    .badge-student {
      background-color: #0dcaf0;
    }

    .badge-candidate {
      background-color: #20c997;
    }
  </style>

</head>
<body>

<div class="container py-5">

  <!-- Header -->

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="page-title">
      <i class="bi bi-calendar-event"></i> Event Management
    </h2>
    <a href="/dashboard" class="btn btn-outline-light">
      <i class="bi bi-arrow-left"></i> Dashboard
    </a>
  </div>

  <!-- Add Event Form -->

  <div class="glass-card mb-5">
    <h5 class="mb-3"><i class="bi bi-plus-circle"></i> Create New Event</h5>
    <form action="/SaveEvent" method="post">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Event Title</label>
          <input type="text" name="title" class="form-control" placeholder="Enter event title" required>
        </div>


    <div class="col-md-6">
      <label class="form-label">Event Type</label>
      <select class="form-select" name="type" required>
        <option value="">Select type</option>
        <option value="Student">Student</option>
        <option value="Employee">Employee</option>
      </select>
    </div>

    <div class="col-md-4">
      <label class="form-label">Event Date</label>
      <input type="date" name="date" class="form-control" required>
    </div>

    <div class="col-md-4">
      <label class="form-label">Start Time</label>
      <input type="time" name="stime" class="form-control" required>
    </div>

    <div class="col-md-4">
      <label class="form-label">End Time</label>
      <input type="time" name="etime" class="form-control" required>
    </div>

    <div class="col-md-12">
      <label class="form-label">Description</label>
      <textarea class="form-control" name="edis" rows="3" placeholder="Event description"></textarea>
    </div>

    <div class="col-md-12 text-end">
      <button type="submit" class="btn btn-custom">
        <i class="bi bi-save"></i> Save Event
      </button>
    </div>
  </div>
</form>

  </div>

  <!-- Event List -->

  <div class="glass-card">
    <h5 class="mb-3"><i class="bi bi-list-ul"></i> Scheduled Events</h5>

<div class="table-responsive">
  <form method="post">
  <table class="table table-dark table-hover align-middle">
    <thead>
      <tr>
        <th>#</th>
        <th>Title</th>
        <th>Type</th>
        <th>Date</th>
        <th>Time</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {%for i in rw%}
      <tr>
        <td>{{loop.index}}</td>
        <td>{{i[1]}}</td>
        <td><span class="badge badge-candidate">{{i[2]}}</span></td>
        <td>{{i[3]}}</td>
        <td>{{i[4]}}-{{i[5]}}</td>
        <td>
          <button class="btn btn-sm btn-warning"><i class="bi bi-pencil"></i></button>
          <button type="submit" class="btn btn-sm btn-danger" formaction="/EventDelete" name="id" value={{i[0]}} ><i class="bi bi-trash"></i></button>
        </td>
      </tr>
{%endfor%}
    </tbody>
  </table>
  </form>
</div>


  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
